<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">SYMPHONY 1.3 — Your music, in motion</title>
<desc id="desc">A showcase of the SYMPHONY Android music player: immersive Flow playback, appearance customisation, listening statistics and library.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090d"/><stop offset=".55" stop-color="#191116"/><stop offset="1" stop-color="#090d12"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#b97887" stop-opacity=".38"/><stop offset="1" stop-color="#b97887" stop-opacity="0"/></radialGradient>
 <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#e7b8bd"/><stop offset="1" stop-color="#9e6474"/></linearGradient>
 <linearGradient id="art" x2=".8" y2="1"><stop stop-color="#f1c66b"/><stop offset=".45" stop-color="#bd6545"/><stop offset="1" stop-color="#201a24"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
 </defs>
 <rect width="1440" height="760" rx="34" fill="url(#bg)"/>
 <ellipse cx="700" cy="650" rx="650" ry="180" fill="url(#glow)" filter="url(#shadow)"/>
 <path d="M0 560 C240 430 330 710 610 560 S1050 430 1440 600" fill="none" stroke="#b77d8b" stroke-opacity=".22" stroke-width="2"/>
 <g font-family="Inter,Arial,sans-serif" fill="#f7eef0">
