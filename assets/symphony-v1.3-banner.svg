  <text x="78" y="205" font-size="76" font-weight="800" letter-spacing="-3">SYMPHONY</text>
  <text x="82" y="258" font-size="28" fill="#e0b6bd" letter-spacing="2">YOUR MUSIC. IN MOTION.</text>
  <text x="82" y="325" font-size="21" fill="#c7b9bd">Flow-led discovery. Deep listening controls.</text>
  <text x="82" y="358" font-size="21" fill="#c7b9bd">A library and visual experience that feels yours.</text>
 </g>
 <g transform="translate(90 430)" font-family="Inter,Arial,sans-serif">
  <g fill="#171418" stroke="#8c6670" stroke-width="2">
