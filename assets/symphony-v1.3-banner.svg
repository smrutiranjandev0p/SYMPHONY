   <text x="227" y="33">STATS</text><text x="227" y="55" font-size="12" font-weight="400">LISTEN</text>
   <text x="385" y="33">LIBRARY</text><text x="385" y="55" font-size="12" font-weight="400">COLLECT</text>
  </g>
 </g>
