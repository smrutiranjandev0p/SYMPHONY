 <g><rect x="20" y="75" width="65" height="30" rx="15" fill="#583944"/><text x="52" y="95" text-anchor="middle" class="ui tiny">All Time</text><rect x="92" y="75" width="55" height="30" rx="15" class="card"/><text x="119" y="95" text-anchor="middle" class="muted tiny">Week</text><rect x="154" y="75" width="55" height="30" rx="15" class="card"/><text x="181" y="95" text-anchor="middle" class="muted tiny">Month</text></g>
 <rect x="20" y="120" width="110" height="91" rx="16" class="card"/><text x="35" y="151" class="muted small">Listening</text><text x="35" y="184" class="ui" font-size="22" font-weight="700">16h 41m</text>
 <rect x="140" y="120" width="110" height="91" rx="16" class="card"/><text x="155" y="151" class="muted small">Plays</text><text x="155" y="184" class="ui" font-size="25" font-weight="700">286</text>
 <rect x="20" y="225" width="230" height="145" rx="18" class="card"/><text x="36" y="253" class="ui small" font-weight="700">Rhythm &amp; Consistency</text><circle cx="78" cy="315" r="37" fill="none" stroke="#423342" stroke-width="10"/><path d="M78 278 A37 37 0 1 1 43 328" fill="none" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/><text x="78" y="321" class="ui" font-size="20" text-anchor="middle" font-weight="700">70</text>
 <text x="132" y="296" class="muted tiny">Avg. Session</text><text x="230" y="296" class="ui tiny" text-anchor="end">120m</text><text x="132" y="324" class="muted tiny">Streak</text><text x="230" y="324" class="ui tiny" text-anchor="end">1 day</text><text x="132" y="350" class="muted tiny">Active Days</text><text x="230" y="350" class="ui tiny" text-anchor="end">3 / 7</text>
 <rect x="20" y="384" width="230" height="86" rx="17" class="card"/><text x="36" y="410" class="ui small" font-weight="700">Listening Stages</text><rect x="36" y="427" width="194" height="8" rx="4" fill="#3a303d"/><rect x="36" y="427" width="128" height="8" rx="4" fill="#e2aeb9"/><rect x="164" y="427" width="46" height="8" fill="#b58bb7"/>
</g>
<!-- central flow phone -->
<g transform="translate(660 48)">
 <rect x="0" y="0" width="340" height="620" rx="48" fill="#05070e" stroke="url(#edge)" stroke-width="4"/>
 <rect x="12" y="12" width="316" height="596" rx="38" fill="#11111b"/>
 <text x="35" y="57" class="ui heading" font-size="23">FLOW</text><circle cx="262" cy="43" r="21" fill="#302d39"/><circle cx="303" cy="43" r="21" fill="#302d39"/><text x="262" y="50" class="ui" font-size="20" text-anchor="middle">⌕</text><text x="303" y="50" class="ui" font-size="19" text-anchor="middle">⚙</text>
 <rect x="25" y="84" width="290" height="380" rx="25" fill="#28202a"/>
 <defs><linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9d36d"/><stop offset=".42" stop-color="#cf694e"/><stop offset="1" stop-color="#201a2a"/></linearGradient></defs>
 <rect x="25" y="84" width="290" height="380" rx="25" fill="url(#sunset)"/>
 <circle cx="235" cy="178" r="56" fill="#ffe7a2" opacity=".85"/>
 <path d="M25 290 Q95 235 150 285 T315 275 V464 H25Z" fill="#241b27" opacity=".85"/>
 <path d="M25 350 Q95 315 160 354 T315 345" fill="none" stroke="#e5a2a1" stroke-opacity=".55" stroke-width="4"/>
 <circle cx="170" cy="335" r="39" fill="#e8b6c0"/><path d="M160 317v36m20-36v36" stroke="#3d2330" stroke-width="8"/>
 <text x="35" y="500" class="ui" font-size="23" font-weight="700">One Love (Audio)</text><text x="35" y="526" class="muted">Shubh</text>
 <path d="M35 553 H305" stroke="#554452" stroke-width="4" stroke-linecap="round"/><path d="M35 553 H164" stroke="#e7b5c2" stroke-width="4" stroke-linecap="round"/>
 <text x="42" y="584" class="ui" font-size="18">♥</text><text x="170" y="584" class="ui" font-size="18">♫</text><text x="286" y="584" class="ui" font-size="18">⋮</text>
</g>
<!-- library device -->
<g transform="translate(1030 112) rotate(3 155 260)">
