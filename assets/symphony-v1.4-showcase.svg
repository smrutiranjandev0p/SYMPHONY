<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">SYMPHONY — Your music. In motion.</title>
<desc id="desc">A premium showcase of SYMPHONY for Android, featuring Flow playback, Appearance and Visuals, Listening Stats, Library and Statistics, with the Glass Wave treble-clef identity.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a12"/><stop offset=".52" stop-color="#10101b"/><stop offset="1" stop-color="#080911"/></linearGradient>
 <radialGradient id="blue"><stop stop-color="#2679ff" stop-opacity=".5"/><stop offset="1" stop-color="#2679ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="pink"><stop stop-color="#d13bce" stop-opacity=".42"/><stop offset="1" stop-color="#d13bce" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293348" stop-opacity=".92"/><stop offset=".55" stop-color="#141622" stop-opacity=".98"/><stop offset="1" stop-color="#251729" stop-opacity=".96"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62b9ff"/><stop offset=".48" stop-color="#b5a0ff"/><stop offset="1" stop-color="#ed78c9"/></linearGradient>
 <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1c6cd"/><stop offset="1" stop-color="#a96e83"/></linearGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18a7ff"/><stop offset=".5" stop-color="#947cff"/><stop offset="1" stop-color="#ec53c8"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
 <style>
 .ui{font-family:Inter,Arial,sans-serif;fill:#f5f3fb}.muted{fill:#a9a8b8;font-family:Inter,Arial,sans-serif}.small{font-size:13px}.tiny{font-size:10px}.heading{font-size:19px;font-weight:700}
 .phone{fill:#080a11;stroke:#69758c;stroke-opacity:.75;stroke-width:3}.screen{fill:#11131d}.card{fill:#201d29}.line{stroke:#484457;stroke-width:1}
 </style>
</defs>
<rect width="1440" height="760" rx="34" fill="url(#bg)"/>
<ellipse cx="350" cy="390" rx="420" ry="360" fill="url(#blue)" filter="url(#blur)"/>
<ellipse cx="1120" cy="390" rx="390" ry="360" fill="url(#pink)" filter="url(#blur)"/>
<path d="M0 650 C260 510 390 790 700 620 S1130 490 1440 650" fill="none" stroke="url(#wave)" stroke-opacity=".35" stroke-width="3"/>
<path d="M0 690 C280 550 420 820 720 670 S1150 550 1440 700" fill="none" stroke="url(#wave)" stroke-opacity=".18" stroke-width="18" filter="url(#shadow)"/>
<!-- left appearance device -->
<g transform="translate(54 92) rotate(-5 150 285)">
 <rect x="0" y="0" width="285" height="565" rx="38" class="phone"/>
 <rect x="10" y="10" width="265" height="545" rx="30" class="screen"/>
 <text x="28" y="49" class="ui heading">Appearance &amp; Visuals</text>
 <text x="28" y="82" class="muted small">Appearance</text>
 <rect x="22" y="98" width="241" height="76" rx="17" class="card"/>
 <text x="40" y="127" class="ui small" font-weight="700">Theme</text><text x="40" y="149" class="muted tiny">System · Light · Dark</text>
 <rect x="22" y="187" width="241" height="150" rx="17" class="card" stroke="#dba7b5" stroke-opacity=".65"/>
 <text x="40" y="216" class="ui small" font-weight="700">App Icon</text><text x="40" y="236" class="muted tiny">Choose your launcher identity</text>
 <g transform="translate(36 251)"><rect width="52" height="58" rx="11" fill="#101c35" stroke="#7c9cff"/><text x="26" y="44" text-anchor="middle" font-size="39" fill="url(#edge)">𝄞</text></g>
 <g transform="translate(105 251)"><rect width="52" height="58" rx="11" fill="#c7f000"/><text x="26" y="44" text-anchor="middle" font-size="39" fill="#092b2b">𝄞</text></g>
 <g transform="translate(174 251)"><rect width="52" height="58" rx="11" fill="#fff"/><text x="26" y="44" text-anchor="middle" font-size="39" fill="#6b9de8">𝄞</text></g>
 <rect x="22" y="350" width="241" height="51" rx="14" class="card"/><text x="40" y="381" class="ui small">AMOLED Mode</text><rect x="210" y="365" width="37" height="20" rx="10" fill="#d9a6b5"/>
 <rect x="22" y="410" width="241" height="51" rx="14" class="card"/><text x="40" y="441" class="ui small">Liquid Glass</text><rect x="210" y="425" width="37" height="20" rx="10" fill="#d9a6b5"/>
 <rect x="22" y="470" width="241" height="51" rx="14" class="card"/><text x="40" y="501" class="ui small">Floating Navigation</text>
</g>
