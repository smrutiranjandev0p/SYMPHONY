<text x="1338" y="372" text-anchor="middle" class="muted tiny" letter-spacing="1.5">TREBLE CLEF EDITION</text>
<text x="720" y="720" text-anchor="middle" class="ui" font-size="37" font-weight="800" letter-spacing="8">SYMPHONY</text>
<text x="720" y="746" text-anchor="middle" class="muted small" letter-spacing="4">YOUR MUSIC. IN MOTION.</text>
