 <rect x="150" y="145" width="120" height="68" rx="14" fill="#54363d"/><text x="165" y="174" class="ui small" font-weight="700">Downloads</text><text x="165" y="193" class="muted tiny">Offline music</text>
 <g><rect x="20" y="226" width="250" height="64" rx="13" class="card"/><rect x="30" y="237" width="43" height="42" rx="8" fill="url(#rose)"/><text x="84" y="254" class="ui small" font-weight="700">Liked Songs</text><text x="84" y="273" class="muted tiny">128 tracks</text>
 <rect x="20" y="299" width="250" height="64" rx="13" class="card"/><rect x="30" y="310" width="43" height="42" rx="8" fill="#9156c9"/><text x="84" y="327" class="ui small" font-weight="700">Liked YT Song</text><text x="84" y="346" class="muted tiny">Connected account</text>
 <rect x="20" y="372" width="250" height="64" rx="13" class="card"/><rect x="30" y="383" width="43" height="42" rx="8" fill="#315a84"/><text x="84" y="400" class="ui small" font-weight="700">Phoenix</text><text x="84" y="419" class="muted tiny">16 tracks</text>
 <rect x="20" y="445" width="250" height="64" rx="13" class="card"/><rect x="30" y="456" width="43" height="42" rx="8" fill="#8c5266"/><text x="84" y="473" class="ui small" font-weight="700">Frozen Wanderlust</text><text x="84" y="492" class="muted tiny">1 track</text></g>
</g>
